<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotabo</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background:linear-gradient(180deg,#f6ecf9 0%, #f3e6f8 40%, #f3e6f8 100%);
    color:#6b5878;
  }
  .spinner{
    width:44px;height:44px;
    border-radius:50%;border:4px solid #e2c3ee;border-top-color:#9b3fc0;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="spinner"></div>
<script>
(function(){
  // Stripe Payment Links redirect here unconditionally after any
  // successful checkout (both the 1-month and 12-month tier links point
  // at this single fixed URL) -- we don't get to pass which
  // category/role the payment was for through Stripe itself, so we
  // recover it from localStorage, set right before the browser left for
  // Stripe, and forward on to the right browse page.
  var raw = localStorage.getItem("rotabo_last_listing");
  var dest = "/";
  if (raw) {
    try {
      var info = JSON.parse(raw);
      if (info && info.category && info.role) {
        dest = "/browse.html?category=" + encodeURIComponent(info.category) + "&role=" + encodeURIComponent(info.role);
      }
    } catch (e) { /* fall back to home */ }
  }
  window.location.replace(dest);
})();
</script>
<script>
(function(){
  try {
    var sid = localStorage.getItem("rotabo_sid");
    if (!sid) { sid = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(16).slice(2))); localStorage.setItem("rotabo_sid", sid); }
    // Visitor country, read from Cloudflare's own trace endpoint on this
    // origin -- no third-party geo service and no IP kept. Anything that
    // is not a plain two-letter code (Tor reports "T1", a dev server has
    // no Cloudflare in front of it) is stored as unknown. Cached for the
    // session so only the first page load pays for the extra request.
    function visitorCountry(){
      var cached = null;
      try { cached = sessionStorage.getItem("rotabo_geo"); } catch (e) {}
      if (cached !== null) return Promise.resolve(cached || null);
      return fetch("/cdn-cgi/trace", { cache: "no-store" })
        .then(function(res){ return res.ok ? res.text() : ""; })
        .then(function(txt){
          var m = /(?:^|\n)loc=([A-Z]{2})(?:\r?\n|$)/.exec(txt || "");
          var code = m ? m[1] : "";
          try { sessionStorage.setItem("rotabo_geo", code); } catch (e) {}
          return code || null;
        })
        .catch(function(){ return null; });
    }

    visitorCountry().then(function(country){
      fetch("https://caqfbpzwdgnwjoaedjrg.supabase.co/rest/v1/site_visits", {
        method: "POST",
        headers: {
          "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhcWZicHp3ZGdud2pvYWVkanJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDkwMzgsImV4cCI6MjEwMTc4NTAzOH0.nds6gT2P32WT0wKoeCFAWuGLX3oipGKtvuU2mwdxi3w",
          "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhcWZicHp3ZGdud2pvYWVkanJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDkwMzgsImV4cCI6MjEwMTc4NTAzOH0.nds6gT2P32WT0wKoeCFAWuGLX3oipGKtvuU2mwdxi3w",
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({ path: location.pathname + location.search, referrer: document.referrer || null, language: navigator.language || null, session_id: sid, country: country }),
        keepalive: true
      }).catch(function(){});
    });
  } catch (e) {}
})();
</script>
</body>
</html>
