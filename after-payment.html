<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Google tag (gtag.js). Only the bootstrap lives here: the purchase
     event itself is fired further down, together with the redirect it
     has to outlive. -->
<script async src="/mx/gtag/js?id=G-ZSR8ZKJ4RL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-ZSR8ZKJ4RL', { transport_type: 'beacon' });
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotabo</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background:linear-gradient(180deg,#f6ecf9 0%, #f3e6f8 40%, #f3e6f8 100%);
    color:#6b5878;
  }
  .spinner{
    width:44px;height:44px;
    border-radius:50%;border:4px solid #e2c3ee;border-top-color:#9b3fc0;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="spinner"></div>
<script>
// Everything this page has to do happens in one block, in one order,
// because all of it races the same redirect.
//
// The order matters and used to be wrong. The purchase event was fired
// in <head> while gtag.js was still loading -- it is async -- and the
// very next script called location.replace(). A queued event is not a
// sent one: transport_type 'beacon' can only rescue a request already
// in flight, so whenever the navigation committed first (a same-origin
// page the service worker answers from cache: almost always) the
// purchase was simply never transmitted. It is the only primary
// conversion this account has, so the loss was invisible and total.
// The site_visits insert had the same problem for the same reason,
// sitting in a script placed *after* the redirect despite its own
// comment saying payment returns must never lose a visit.
//
// Now: work out where to go, send both signals, and only leave once
// gtag says the purchase is away (or a timer says it never will be).
(function(){
  // ----- 1. where Stripe should have sent us -----
  // Payment Links redirect here unconditionally after any successful
  // checkout (both the 1-month and 12-month tier links point at this
  // single fixed URL) -- we don't get to pass which category/role the
  // payment was for through Stripe itself, so we recover it from
  // localStorage, set right before the browser left for Stripe.
  var dest = "/";
  try {
    // A viewer-access purchase leaves a return note (set by viewer.js at
    // the moment the tier link is clicked). It must win over
    // rotabo_last_listing, which is only ever written when a LISTING is
    // created and is never cleared -- without this, someone paying to
    // view a translator was bounced to the page of a listing they
    // created weeks ago.
    var back = localStorage.getItem("rotabo_return_to");
    if (back && back.charAt(0) === "/") {
      dest = back;
      localStorage.removeItem("rotabo_return_to");
    } else {
      var raw = localStorage.getItem("rotabo_last_listing");
      if (raw) {
        var info = JSON.parse(raw);
        if (info && info.category && info.role) {
          dest = "/browse.html?category=" + encodeURIComponent(info.category) + "&role=" + encodeURIComponent(info.role);
        }
      }
    }
  } catch (e) { /* storage denied or bad JSON: fall back to home */ }

  // ----- 2. record the visit, before anything can navigate -----
  // keepalive lets the request outlive the page, but only once it has
  // actually been issued -- hence its place here rather than after the
  // redirect. Never wait for a geo lookup: use the country this session
  // already cached, or record the visit without one.
  try {
    // The visits table stores the query string, and account.html is where
    // a password-recovery link lands with its token in that query string.
    // Analytics is not a place to write down credentials, so anything
    // that looks like one is dropped before the row is sent. gclid stays:
    // the paid/organic split is derived from it.
    function safePath(){
      try {
        var u = new URL(location.href);
        ["code","token","token_hash","access_token","refresh_token","otp","secret","password","email_otp"].forEach(function(k){ u.searchParams.delete(k); });
        return u.pathname + (u.search || "");
      } catch (e) { return location.pathname; }
    }

    var sid = localStorage.getItem("rotabo_sid");
    if (!sid) { sid = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(16).slice(2))); localStorage.setItem("rotabo_sid", sid); }
    var country = null;
    try { country = sessionStorage.getItem("rotabo_geo") || null; } catch (e) {}
    var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhcWZicHp3ZGdud2pvYWVkanJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDkwMzgsImV4cCI6MjEwMTc4NTAzOH0.nds6gT2P32WT0wKoeCFAWuGLX3oipGKtvuU2mwdxi3w";
    fetch("https://auth.rotabo.app/rest/v1/site_visits", {
      method: "POST",
      headers: {
        "apikey": KEY,
        "Authorization": "Bearer " + KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({ path: safePath(), referrer: document.referrer || null, language: navigator.language || null, session_id: sid, country: country }),
      keepalive: true
    }).catch(function(){});
  } catch (e) {}

  // ----- 3. leave, but not before the purchase is on its way -----
  var gone = false;
  function go(){
    if (gone) return;
    gone = true;
    window.location.replace(dest);
  }

  // GA4's standard purchase event (a key event by default, and the one
  // Google Ads imports as a conversion). Stripe's fixed return URL
  // carries no amount, so the page that sent the browser to Stripe
  // leaves the CHF figure behind in rotabo_paid_value -- without it
  // every purchase reports as worth 0, and Performance Max (which bids
  // on conversion value) has nothing to optimize towards.
  var ev = { currency: 'CHF', event_callback: go, event_timeout: 1200 };
  try {
    var v = parseFloat(localStorage.getItem('rotabo_paid_value'));
    if (isFinite(v) && v > 0) ev.value = v;
    localStorage.removeItem('rotabo_paid_value');
    // transaction_id is how GA4 deduplicates purchases. Without it every
    // purchase reported as (not set) and two deliveries of the same
    // conversion could both be counted -- which matters here because
    // purchase is the only primary conversion this account has, and
    // Google Ads bids on it. The page that sent the browser to Stripe
    // leaves the id behind, since Stripe's fixed return URL carries none.
    var txn = localStorage.getItem('rotabo_paid_id');
    if (txn) { ev.transaction_id = txn; localStorage.removeItem('rotabo_paid_id'); }
  } catch (e) { /* storage denied: report the purchase without a value */ }

  // Sending it. This line did not exist until 2026-08-22: ev was built
  // above, documented at length, and then never handed to gtag, so GA4
  // recorded no purchases at all and Google Ads -- whose only primary
  // conversion is purchase -- had nothing to bid on. Nobody noticed
  // because the redirect below is on a timer and works either way.
  //
  // ?free=1 is how index.html arrives here after publishing a listing
  // during the free period. That is not a purchase and must not be
  // reported as one: purchase carries the value Performance Max bids on,
  // and counting free listings at zero would drag that value down. It
  // gets its own event instead, to be imported as a conversion in Ads.
  if (/(?:^|[?&])free=1(?:&|$)/.test(location.search)) {
    // Nothing was paid, so no stamp from an earlier unlock attempt may
    // survive into the page we are about to hand over to: browse.html
    // reads it, believes a checkout is landing, and opens the modal on
    // "Confirming your payment…" for three minutes.
    try { localStorage.removeItem('rotabo_viewer_paid_at'); } catch (e) {}
    gtag('event', 'listing_published', { event_callback: go, event_timeout: 1200 });
  } else {
    gtag('event', 'purchase', ev);
  }

  // event_callback needs gtag.js to have loaded to fire at all, and an
  // ad blocker means it never will. This is the floor under that: the
  // buyer waits at most a second and a half, staring at a spinner they
  // were already going to see, and never gets stranded here.
  setTimeout(go, 1500);
})();
</script>
</body>
</html>
