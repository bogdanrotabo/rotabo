<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Google tag (gtag.js). This page redirects almost immediately, so the
     event below is sent as a beacon: it is the one signal that a Stripe
     checkout actually completed (begin_checkout is fired on the way out). -->
<script async src="/mx/gtag/js?id=G-ZSR8ZKJ4RL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-ZSR8ZKJ4RL', { transport_type: 'beacon' });
  // GA4's standard purchase event (a key event by default, and the one
  // Google Ads imports as a conversion). Stripe's fixed return URL
  // carries no amount, so the page that sent the browser to Stripe
  // leaves the CHF figure behind in rotabo_paid_value -- without it
  // every purchase reports as worth 0, and Performance Max (which bids
  // on conversion value) has nothing to optimize towards.
  (function(){
    var ev = { currency: 'CHF' };
    try {
      var v = parseFloat(localStorage.getItem('rotabo_paid_value'));
      if (isFinite(v) && v > 0) ev.value = v;
      localStorage.removeItem('rotabo_paid_value');
    } catch (e) { /* storage denied: report the purchase without a value */ }
    gtag('event', 'purchase', ev);
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotabo</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background:linear-gradient(180deg,#f6ecf9 0%, #f3e6f8 40%, #f3e6f8 100%);
    color:#6b5878;
  }
  .spinner{
    width:44px;height:44px;
    border-radius:50%;border:4px solid #e2c3ee;border-top-color:#9b3fc0;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="spinner"></div>
<script>
(function(){
  // Stripe Payment Links redirect here unconditionally after any
  // successful checkout (both the 1-month and 12-month tier links point
  // at this single fixed URL) -- we don't get to pass which
  // category/role the payment was for through Stripe itself, so we
  // recover it from localStorage, set right before the browser left for
  // Stripe, and forward on to the right browse page.
  var dest = "/";
  try {
    // A viewer-access purchase leaves a return note (set by viewer.js at
    // the moment the tier link is clicked). It must win over
    // rotabo_last_listing, which is only ever written when a LISTING is
    // created and is never cleared -- without this, someone paying to
    // view a translator was bounced to the page of a listing they
    // created weeks ago.
    var back = localStorage.getItem("rotabo_return_to");
    if (back && back.charAt(0) === "/") {
      dest = back;
      localStorage.removeItem("rotabo_return_to");
    } else {
      var raw = localStorage.getItem("rotabo_last_listing");
      if (raw) {
        var info = JSON.parse(raw);
        if (info && info.category && info.role) {
          dest = "/browse.html?category=" + encodeURIComponent(info.category) + "&role=" + encodeURIComponent(info.role);
        }
      }
    }
  } catch (e) { /* storage denied or bad JSON: fall back to home */ }
  window.location.replace(dest);
})();
</script>
<script>

    // This page navigates away almost immediately (the replace() above),
    // and a fetch that has not been ISSUED yet dies with the page --
    // keepalive only saves requests already in flight. So unlike the

    // country if the session has one, otherwise record the visit without

    try { country = sessionStorage.getItem("rotabo_geo") || null; } catch (e) {}
    fetch("https://caqfbpzwdgnwjoaedjrg.supabase.co/rest/v1/site_visits", {
      method: "POST",
