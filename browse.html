<style>
  :root{
    --bg-top:#f6ecf9;
    --bg-mid:#f3e6f8;
    --bg-card:#f7edfa;
    --border:#e2c3ee;
    --violet-1:#7c2d9c;
    --violet-2:#9b3fc0;
    --text-dark:#3a1650;
    --text-body:#6b5878;
    --text-eyebrow:#8a7a94;
    --green:#3ecb7e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background:linear-gradient(180deg,var(--bg-top) 0%, var(--bg-mid) 40%, var(--bg-mid) 100%);
    color:var(--text-body);
  }
  header{border-bottom:1px solid var(--border);background:linear-gradient(180deg,#f8eefb,#f4e8f8);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;max-width:1080px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.6rem;color:var(--violet-1);text-decoration:none;}
  .brand svg{width:24px;height:31px;filter:drop-shadow(0 4px 10px rgba(124,37,150,.25));}

  .wrap{max-width:640px;margin:0 auto;padding:48px 24px 80px;}
  .eyebrow{color:var(--text-eyebrow);letter-spacing:.1em;font-size:.82rem;font-weight:700;margin-bottom:10px;}
  h1{color:var(--text-dark);font-size:1.7rem;margin:0 0 8px;}
  .sub{color:var(--text-body);font-size:1rem;margin:0 0 32px;}

  .state-card{
    background:var(--bg-card);border:1px solid var(--border);
    border-radius:20px;padding:36px;text-align:center;
  }
  .spinner{
    width:44px;height:44px;margin:0 auto 20px;
    border-radius:50%;border:4px solid var(--border);border-top-color:var(--violet-2);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .home-link{display:inline-block;margin-top:20px;color:var(--violet-2);font-weight:700;text-decoration:none;}

  .my-listing{
    background:#eefaf3;border:1px solid #bfe8cf;border-radius:16px;
    padding:18px 20px;margin-bottom:24px;
  }
  .my-listing .my-eyebrow{color:var(--green);font-weight:800;font-size:.82rem;letter-spacing:.05em;margin-bottom:6px;}
  .my-listing .my-sub{color:var(--text-body);font-size:.88rem;margin-bottom:10px;}
  .my-listing .my-name{font-weight:800;color:var(--text-dark);font-size:1rem;}
  .my-listing .my-detail{color:var(--text-body);font-size:.92rem;margin-top:2px;}

  .filter-field{margin-bottom:18px;display:flex;gap:8px;}
  .city-filter{
    flex:1;min-width:0;padding:12px 14px;border-radius:10px;
    border:1px solid var(--border);background:#fff;
    color:var(--text-dark);font-size:1rem;font-family:inherit;box-sizing:border-box;
  }
  .city-filter:focus{outline:2px solid var(--violet-2);outline-offset:1px;}
  .filter-btn{
    flex-shrink:0;padding:12px 20px;border-radius:10px;border:none;
    background:linear-gradient(135deg,#9b2fbf,#7c2596);color:#fff;
    font-weight:800;font-size:.95rem;cursor:pointer;
  }

  .request-list{display:flex;flex-direction:column;gap:14px;}
  .request-card{
    background:#fff;border:1px solid var(--border);border-radius:16px;
    padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .request-info .name{font-weight:800;color:var(--text-dark);font-size:1.05rem;}
  .request-info .city{color:var(--text-eyebrow);font-size:.9rem;margin-top:3px;}
  .request-info .address{color:var(--text-body);font-size:.9rem;margin-top:3px;}
  .request-info .note{color:var(--text-body);font-size:.92rem;margin-top:4px;}
  .contact-actions{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;}
  .call-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:linear-gradient(135deg,#9b2fbf,#7c2596);color:#fff;
    border:none;border-radius:12px;padding:11px 20px;
    font-weight:800;font-size:.95rem;text-decoration:none;flex-shrink:0;
  }
  .email-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:#fff;border:1px solid var(--border);color:var(--text-dark);
    border-radius:12px;padding:11px 20px;
    font-weight:800;font-size:.95rem;text-decoration:none;flex-shrink:0;
  }
  .empty-note{color:var(--text-eyebrow);text-align:center;padding:24px 0;}
</style>
</head>

    "Vietnam":["Hanoi","Ho Chi Minh City","Hai Phong","Da Nang","Can Tho","Bien Hoa","Hue","Nha Trang","Buon Ma Thuot","Vung Tau","Qui Nhon","Rach Gia","Long Xuyen","Thai Nguyen","Thanh Hoa","Nam Dinh","Vinh","Phan Thiet","Ha Long","My Tho","Cam Ranh","Da Lat","Soc Trang","Pleiku","Cao Lanh","Bac Lieu","Tuy Hoa","Dong Hoi","Ben Tre","Tra Vinh","Chau Doc","Sa Dec","Ca Mau","Hoi An","Sam Son","Bac Ninh","Hung Yen","Ninh Binh","Phu Ly","Viet Tri"],"Yemen":["Sana'a"],"Zambia":["Lusaka"],"Zimbabwe":["Harare"]
  };

  var fullCityListHTML = null;
  function findCityKey(countryValue){
    var name = (countryValue || "").trim();
    if (!name) return null;
    if (CITY_BY_COUNTRY[name]) return name;
    var lower = name.toLowerCase();
    for (var key in CITY_BY_COUNTRY) {
      if (key.toLowerCase() === lower) return key;
    }
    return null;
  }

  function narrowCityListToCountry(countryValue){
    var cityList = document.getElementById("cityList");
    if (!cityList) return;
    if (fullCityListHTML === null) fullCityListHTML = cityList.innerHTML;
    var key = findCityKey(countryValue);
    if (!key) {
      cityList.innerHTML = fullCityListHTML;
      return;
    }
    cityList.innerHTML = CITY_BY_COUNTRY[key].map(function(city){
      return '<option value="' + city.replace(/"/g, "&quot;") + '">';
    }).join("");
  }

  function renderNotRegistered(){
    content.innerHTML =
      '<div class="state-card">' +
      '<p></p>' +
      '<a class="home-link" href="/"></a>' +
      '</div>';
    content.querySelector("p").textContent = tr("not_registered_body");
    content.querySelector(".home-link").textContent = tr("register_link");
  }

  function renderPendingConfirmation(){
    content.innerHTML =
      '<div class="state-card">' +
      '<div class="spinner"></div>' +
      '<p></p>' +
      '</div>';
    content.querySelector("p").textContent = tr("pending_confirmation");
  }

  function timeAgo(iso){
    var diffMs = Date.now() - new Date(iso).getTime();
    var mins = Math.max(0, Math.round(diffMs / 60000));
    if (mins < 1) return tr("time_just_now");
    if (mins === 1) return tr("time_min_ago_one");
    if (mins < 60) return tr("time_min_ago_other", { n: mins });
    var hrs = Math.round(mins / 60);
    return hrs === 1 ? tr("time_hour_ago_one") : tr("time_hour_ago_other", { n: hrs });
  }

  function renderMyListing(){
    sb.from("listings")
      .select("name, phone, email, city, country, address, note")
      .eq("id", listingId)
      .maybeSingle()
      .then(function(res){
        var box = document.getElementById("myListing");
        if (!box || res.error || !res.data) return;
        var row = res.data;
        var location = [row.city, row.country].filter(Boolean).join(", ");
        var html = '<div class="my-eyebrow"></div><p class="my-sub"></p>'
          + '<div class="my-name"></div>'
          + '<div class="my-detail my-location"></div>'
          + '<div class="my-detail my-address"></div>'
          + '<div class="my-detail my-note"></div>';
        box.innerHTML = html;
        box.querySelector(".my-eyebrow").textContent = tr("my_listing_title");
        box.querySelector(".my-sub").textContent = tr("my_listing_sub");
        box.querySelector(".my-name").textContent = row.name;
        var locEl = box.querySelector(".my-location");
        if (location) { locEl.textContent = location; } else { locEl.remove(); }
        var addrEl = box.querySelector(".my-address");
        if (row.address) { addrEl.textContent = row.address; } else { addrEl.remove(); }
        var noteEl = box.querySelector(".my-note");
        if (row.note) { noteEl.textContent = row.note; } else { noteEl.remove(); }
      });
  }

  function renderDashboard(){
    content.innerHTML =
      '<div class="my-listing" id="myListing"></div>' +
      '<div class="filter-field"><input type="text" id="countryFilter" class="city-filter" list="countryList" autocomplete="off"><button type="button" class="filter-btn" id="countryFilterBtn"></button></div>' +
      '<div class="filter-field"><input type="text" id="cityFilter" class="city-filter" list="cityList" autocomplete="off"></div>' +
      '<div class="request-list" id="requestList"></div>';
    renderMyListing();
    var filterInput = document.getElementById("countryFilter");
    var filterBtn = document.getElementById("countryFilterBtn");
    var cityInput = document.getElementById("cityFilter");
    filterInput.placeholder = tr("country_filter_placeholder");
    filterBtn.textContent = tr("search_btn");
    cityInput.placeholder = tr("city_filter_placeholder");
    function applyFilter(){
      countryFilter = filterInput.value.trim();
      cityFilter = cityInput.value.trim();
      loadListings();
    }
    filterInput.addEventListener("input", function(){
      narrowCityListToCountry(filterInput.value);
      applyFilter();
    });
    filterInput.addEventListener("keydown", function(e){
      if (e.key === "Enter") { e.preventDefault(); applyFilter(); }
    });
    filterBtn.addEventListener("click", applyFilter);
    cityInput.addEventListener("input", applyFilter);
    cityInput.addEventListener("keydown", function(e){
      if (e.key === "Enter") { e.preventDefault(); applyFilter(); }
    });
    // Same fix as the registration forms: a <datalist> input that
    // already holds a full value won't reopen with the full option
    // list on refocus in most browsers -- clear it on focus so it
    // does, restoring the previous value on blur if nothing new was
    // picked.
    [filterInput, cityInput].forEach(function(input){
      var previousValue = "";
      input.addEventListener("focus", function(){
        previousValue = input.value;
        input.value = "";
      });
      input.addEventListener("blur", function(){
        if (!input.value.trim() && previousValue) { input.value = previousValue; }
      });
    });
    loadListings();
    if (!listPollTimer) {
      listPollTimer = setInterval(loadListings, LIST_POLL_MS);
    }
  }

  var loadListingsRequestId = 0;
  function loadListings(){
    var requestId = ++loadListingsRequestId;
    var query = sb.from("listings")
      .select("id, name, city, country, address, phone, email, note, created_at")
      .eq("category", category)
      .eq("role", browseRole)
      .order("created_at", { ascending: false });
    if (countryFilter) query = query.ilike("country", "%" + countryFilter + "%");
    if (cityFilter) query = query.ilike("city", "%" + cityFilter + "%");

    query.then(function(res){
      // A later filter change or poll tick may have started a newer
      // request that resolves before this one -- discard this result
      // if it's no longer the most recent request in flight, otherwise
      // a stale response can overwrite a fresher, correct one.
      if (requestId !== loadListingsRequestId) return;
      var list = document.getElementById("requestList");
      if (!list) return;
      if (res.error) return;

      var rows = res.data || [];
      if (rows.length === 0) {
        list.innerHTML = '<p class="empty-note"></p>';
        list.querySelector(".empty-note").textContent = tr("empty_note");
        return;
      }

      list.innerHTML = "";
      rows.forEach(function(row){
        var card = document.createElement("div");
        card.className = "request-card";
        card.innerHTML =
          '<div class="request-info">'
          + '<div class="name"></div>'
          + '<div class="city"></div>'
          + '<div class="address"></div>'
          + '<div class="note"></div>'
          + '</div>'
          + '<div class="contact-actions">'
          + '<a class="call-btn"></a>'
          + '<a class="email-btn"></a>'
          + '</div>';
        card.querySelector(".name").textContent = row.name;
        var location = [row.city, row.country].filter(Boolean).join(", ");
        card.querySelector(".city").textContent = location + " · " + timeAgo(row.created_at);
        var addressEl = card.querySelector(".address");
        if (row.address) { addressEl.textContent = row.address; } else { addressEl.remove(); }
        var noteEl = card.querySelector(".note");
        if (row.note) { noteEl.textContent = row.note; } else { noteEl.remove(); }
        var callBtn = card.querySelector(".call-btn");
        if (row.phone) {
          callBtn.href = "tel:" + row.phone;
          callBtn.textContent = tr("call_btn");
        } else {
          callBtn.remove();
        }
        var emailBtn = card.querySelector(".email-btn");
        if (row.email) {
          emailBtn.href = "mailto:" + row.email;
          emailBtn.textContent = tr("email_btn");
        } else {
          emailBtn.remove();
        }
        list.appendChild(card);
      });
    });
  }

  function init(){
    if (!listingId) {
      renderNotRegistered();
      return;
    }

    sb.from("listing_status")
      .select("id, stripe_session_id, visible_until")
      .eq("id", listingId)
      .maybeSingle()
      .then(function(res){
        if (res.error || !res.data) {
          renderNotRegistered();
          return;
        }
        if (!res.data.stripe_session_id) {
          renderPendingConfirmation();
          setTimeout(init, 3000);
          return;
        }
        renderDashboard();
      });
  }

  loadTranslations().then(init);
})();
</script>
