<style>
  :root{
    --bg-top:#f6ecf9;
    --bg-mid:#f3e6f8;
    --bg-card:#f7edfa;
    --border:#e2c3ee;
    --violet-1:#7c2d9c;
    --violet-2:#9b3fc0;
    --text-dark:#3a1650;
    --text-body:#6b5878;
    --text-eyebrow:#8a7a94;
    --green:#3ecb7e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background:linear-gradient(180deg,var(--bg-top) 0%, var(--bg-mid) 40%, var(--bg-mid) 100%);
    color:var(--text-body);
  }
  header{border-bottom:1px solid var(--border);background:linear-gradient(180deg,#f8eefb,#f4e8f8);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;max-width:1080px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.6rem;color:var(--violet-1);text-decoration:none;}
  .brand svg{width:24px;height:31px;filter:drop-shadow(0 4px 10px rgba(124,37,150,.25));}
  /* The pair is one mark, so the two sit closer to each other than the mark
     does to the word: a full 12px of flex gap between a logo and its own
     second half reads as two logos standing side by side. */
  .brand svg + svg{margin-inline-start:-6px;}
  .brand svg.mark-gold{filter:drop-shadow(0 4px 10px rgba(196,140,0,.28));}
  .account-link{color:var(--violet-2);font-weight:700;font-size:.92rem;text-decoration:none;}

  .wrap{max-width:640px;margin:0 auto;padding:48px 24px 80px;}
  .eyebrow{color:var(--text-eyebrow);letter-spacing:.1em;font-size:.82rem;font-weight:700;margin-bottom:10px;}
  h1{color:var(--text-dark);font-size:1.7rem;margin:0 0 8px;}
  .sub{color:var(--text-body);font-size:1rem;margin:0 0 32px;}

  .state-card{
    background:var(--bg-card);border:1px solid var(--border);
    border-radius:20px;padding:36px;text-align:center;
  }
  .spinner{
    width:44px;height:44px;margin:0 auto 20px;
    border-radius:50%;border:4px solid var(--border);border-top-color:var(--violet-2);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .home-link{display:inline-block;margin-top:20px;color:var(--violet-2);font-weight:700;text-decoration:none;}

  .my-listing{
    background:#eefaf3;border:1px solid #bfe8cf;border-radius:16px;
    padding:18px 20px;margin-bottom:24px;
  }
  .my-listing:empty{display:none;}
  /* An expired listing is not good news, and the green card said it was. */
  .my-listing.expired{background:#f6f4f8;border-color:var(--border);}
  .my-listing.expired .my-eyebrow{color:var(--text-eyebrow);}
  .my-listing .my-eyebrow{color:var(--green);font-weight:800;font-size:.82rem;letter-spacing:.05em;margin-bottom:6px;}
  .my-listing .my-sub{color:var(--text-body);font-size:.88rem;margin-bottom:10px;}
  .my-listing .my-name{font-weight:800;color:var(--text-dark);font-size:1rem;}
  .my-listing .my-detail{color:var(--text-body);font-size:.92rem;margin-top:2px;}

  .filter-field{margin-bottom:18px;display:flex;gap:8px;}
  .city-filter{
    flex:1;min-width:0;padding:12px 14px;border-radius:10px;
    border:1px solid var(--border);background:#fff;
    color:var(--text-dark);font-size:1rem;font-family:inherit;box-sizing:border-box;
  }
  .city-filter:focus{outline:2px solid var(--violet-2);outline-offset:1px;}
  .filter-btn{
    flex-shrink:0;padding:12px 20px;border-radius:10px;border:none;
    background:linear-gradient(135deg,#9b2fbf,#7c2596);color:#fff;
    font-weight:800;font-size:.95rem;cursor:pointer;
  }

  .request-list{display:flex;flex-direction:column;gap:14px;}
  .request-card{
    background:#fff;border:1px solid var(--border);border-radius:16px;
    padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .request-info{min-width:0;overflow-wrap:anywhere;}
  .request-info .name{font-weight:800;color:var(--text-dark);font-size:1.05rem;}
  .request-info .city{color:var(--text-eyebrow);font-size:.9rem;margin-top:3px;}
  .request-info .address{color:var(--text-body);font-size:.9rem;margin-top:3px;}
  .request-info .note{color:var(--text-body);font-size:.92rem;margin-top:4px;}
  /* flex-shrink:0 used to sit here and on both buttons, so nothing in this
     row could give. On a 375px screen the Russian label -- "Электронная
     почта" -- made the row wider than the card and it hung twenty-one pixels
     outside it, taking the whole page into sideways scrolling. flex-wrap was
     already here and never got its chance: a row that cannot shrink is never
     too narrow to wrap. min-width:0 is what lets a flex child actually go
     below its content width. */
  .contact-actions{display:flex;gap:8px;flex-wrap:wrap;min-width:0;}
  .call-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:linear-gradient(135deg,#9b2fbf,#7c2596);color:#fff;
    border:none;border-radius:12px;padding:11px 20px;
    font-weight:800;font-size:.95rem;text-decoration:none;max-width:100%;overflow-wrap:anywhere;
  }
  .email-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:#fff;border:1px solid var(--border);color:var(--text-dark);
    border-radius:12px;padding:11px 20px;
    font-weight:800;font-size:.95rem;text-decoration:none;max-width:100%;overflow-wrap:anywhere;
  }
  .empty-note{color:var(--text-eyebrow);text-align:center;padding:24px 0;}

  /* The locked state, which is now what a stranger sees on this page:
     a headcount, a price and a button, and nothing at all about the
     people behind it. */
  .locked-card{
    background:var(--bg-card);border:1px solid var(--border);
    border-radius:20px;padding:36px 28px;text-align:center;
  }
  .locked-card .lock{font-size:2rem;line-height:1;margin-bottom:12px;}
  .locked-card .locked-count{color:var(--text-dark);font-size:1.2rem;font-weight:800;margin:0 0 10px;}
  .locked-card .locked-body{color:var(--text-body);font-size:.98rem;line-height:1.55;margin:0 auto 16px;max-width:420px;}
  .locked-card .locked-price{
    display:flex;flex-wrap:wrap;gap:4px 20px;justify-content:center;
    color:var(--violet-1);font-weight:700;font-size:.95rem;margin:0 0 20px;
  }
  .locked-card .locked-btn{
    display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;
    background:linear-gradient(135deg,#9b2fbf,#7c2596);color:#fff;
    border-radius:12px;padding:14px 26px;
    font-weight:800;font-size:1rem;font-family:inherit;
  }
</style>
</head>

      <stop offset="0%" stop-color="#c264e0"/>
      <stop offset="55%" stop-color="#a239c9"/>
      <stop offset="100%" stop-color="#7c2596"/>
    </radialGradient>
    <!-- One yellow, not three. The violet beside it is a real gradient; this
         one is a gradient element holding the same colour at every stop, which
         is a flat fill written in the shape the violet uses. Kept that way so
         the two marks stay obviously siblings in the file, and so putting a
         gradient back is a matter of changing values rather than markup.

         Every page draws the mark from this block, so a page that keeps its
         own stops does not have a slightly different logo -- it has a
         different logo, on the same site, one click away from the first. -->
    <radialGradient id="diamondGold" cx="50%" cy="50%" r="75%">

      <stop offset="45%" stop-color="#ffd41a"/>
      <stop offset="100%" stop-color="#ffd41a"/>

    document.getElementById("pageTitle").textContent = "No connection — please reload";

    return;

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    global: { fetch: function(url, options){ return fetch(url, Object.assign({}, options, { cache: "no-store" })); } }
  });
  var LIST_POLL_MS = 5000;
  var VALID_CATEGORIES = ["drive", "translator", "move", "build", "tools", "home", "auto", "care", "learn", "stay", "pets", "other"];

  var params = new URLSearchParams(window.location.search);
  var category = params.get("category");
  var myRole = params.get("role"); // "seeking" or "offering" -- my own listing's role
  if (VALID_CATEGORIES.indexOf(category) === -1 || (myRole !== "seeking" && myRole !== "offering")) {
    document.getElementById("pageTitle").textContent = "Not found";
    document.getElementById("content").innerHTML = "";
    return;
  }
  var browseRole = myRole === "seeking" ? "offering" : "seeking";
  // Guarded: with cookies/site data blocked, touching localStorage
  // throws -- and an unguarded read here used to kill this entire
  // script, freezing the page at "Loading…" for exactly the paying
  // users the fallbacks below were written for.
  var listingId = null;
  try { listingId = localStorage.getItem("rotabo_listing_" + category + "_" + myRole); } catch (e) {}

  // Minimal i18n: reuse the language the visitor already chose on the
  // homepage (persisted in localStorage). No language switcher here on
  // purpose -- this is a working tool for someone who just paid, not a
  // marketing page.
  var LANG = "en";
  try { LANG = localStorage.getItem("rotabo_lang") || "en"; } catch (e) {}
  var T = {
    eyebrow: category.toUpperCase(),
    offering_title: "{category} providers near you",
    seeking_title: "People who need {category}",
    subtitle: "Unlock full access to see who is here, with phone and address.",
    locked_count_one: "1 person is here right now.",
    locked_count_other: "{n} people are here right now.",
    locked_body: "To see who they are — name, city, phone and address — you need to be here too. Publishing your own listing is free. After that, 2 CHF opens this category for a year.",
    locked_btn: "Unlock full access",
    locked_empty: "Nobody is here yet. There is nothing to unlock — come back later, or add yourself from the home page.",

        document.documentElement.setAttribute("lang", LANG);

        // of finished titles; everything without them keeps the template.
        var titleKey = myRole === "seeking" ? "offering_title" : "seeking_title";

  var fullCityListHTML = null;
  function findCityKey(countryValue){
    var name = (countryValue || "").trim();
    if (!name) return null;
    if (CITY_BY_COUNTRY[name]) return name;
    var lower = name.toLowerCase();
    for (var key in CITY_BY_COUNTRY) {
      if (key.toLowerCase() === lower) return key;
    }
    return null;
  }

  function narrowCityListToCountry(countryValue){
    var cityList = document.getElementById("cityList");
    if (!cityList) return;
    if (fullCityListHTML === null) fullCityListHTML = cityList.innerHTML;
    var key = findCityKey(countryValue);
    if (!key) {
      cityList.innerHTML = fullCityListHTML;
      return;
    }
    cityList.innerHTML = CITY_BY_COUNTRY[key].map(function(city){
      return '<option value="' + city.replace(/"/g, "&quot;") + '">';
    }).join("");
  }

  function renderPendingConfirmation(){
    content.innerHTML =
      '<div class="state-card">' +
      '<div class="spinner"></div>' +
      '<p></p>' +
      '</div>';
    content.querySelector("p").textContent = tr("pending_confirmation");
  }

  function timeAgo(iso){
    var diffMs = Date.now() - new Date(iso).getTime();
    var mins = Math.max(0, Math.round(diffMs / 60000));
    if (mins < 1) return tr("time_just_now");
    if (mins === 1) return tr("time_min_ago_one");
    if (mins < 60) return tr("time_min_ago_other", { n: mins });
    var hrs = Math.round(mins / 60);
    // Past a day the hour count stops being information: a listing from
    // three months ago read "2184 hours ago". There is no translated
    // day or week unit to fall back on, so hand the job to the browser,
    // which knows how to write a date in the reader's own language.
    if (hrs >= 24) {
      try {
        return new Date(iso).toLocaleDateString(LANG || undefined, { day: "numeric", month: "short" });
      } catch (e) {
        return new Date(iso).toLocaleDateString();
      }
    }
    return hrs === 1 ? tr("time_hour_ago_one") : tr("time_hour_ago_other", { n: hrs });
  }

  function renderMyListing(){
    // The page is open to everyone now, so having a listing here is the
    // exception rather than the rule. Without one there is nothing to
    // show, and .my-listing:empty keeps the green card from appearing.
    if (!listingId) return;
    sb.rpc("get_own_listing", { p_id: listingId })
      .then(function(res){
        var box = document.getElementById("myListing");
        var row = res.data && res.data[0];
        if (!box || res.error || !row) return;
        // An expired listing still comes back from get_own_listing, and
        // the card used to announce "Your listing is live" over it --
        // at exactly the moment browse_public had stopped showing them
        // to anyone and account.html was calling the same row "Expired".
        // The two pages now agree, and the owner gets the one signal
        // that matters: this needs renewing.
        var live = row.visible_until && new Date(row.visible_until).getTime() > Date.now();
        var location = [row.city, row.country].filter(Boolean).join(", ");
        var html = '<div class="my-eyebrow"></div><p class="my-sub"></p>'
          + '<div class="my-name"></div>'
          + '<div class="my-detail my-location"></div>'
          + '<div class="my-detail my-address"></div>'
          + '<div class="my-detail my-note"></div>';
        box.innerHTML = html;
        box.classList.toggle("expired", !live);
        box.querySelector(".my-eyebrow").textContent = live ? tr("my_listing_title") : trAccount("status_expired", "Expired");
        var subEl = box.querySelector(".my-sub");
        if (live) { subEl.textContent = tr("my_listing_sub"); } else { subEl.remove(); }
        box.querySelector(".my-name").textContent = row.name;
        var locEl = box.querySelector(".my-location");
        if (location) { locEl.textContent = location; } else { locEl.remove(); }
        var addrEl = box.querySelector(".my-address");
        if (row.address) { addrEl.textContent = row.address; } else { addrEl.remove(); }
        var noteEl = box.querySelector(".my-note");
        if (row.note) { noteEl.textContent = row.note; } else { noteEl.remove(); }
      });
  }

  function renderDashboard(){
    // The filter boxes are recreated empty by the innerHTML below, so the
    // globals have to go with them. Leaving them set meant a viewer who
    // had typed "Switzerland", then hit the paywall and paid, came back
    // to a full-looking dashboard silently filtered to one country by a
    // box that showed nothing.
    countryFilter = "";
    cityFilter = "";
    lastBrowseSig = null;
    content.innerHTML =
      '<div class="my-listing" id="myListing"></div>' +
      '<div class="filter-field"><input type="text" id="countryFilter" class="city-filter" list="countryList" autocomplete="off"><button type="button" class="filter-btn" id="countryFilterBtn"></button></div>' +
      '<div class="filter-field"><input type="text" id="cityFilter" class="city-filter" list="cityList" autocomplete="off"></div>' +
      '<div class="request-list" id="requestList"></div>';
    renderMyListing();
    // The page subtitle is the paywall's pitch ("Unlock full access to
    // see who is here"). Once they have, it is stale advice sitting
    // above the very thing it is asking them to buy.
    var subEl = document.getElementById("pageSub");
    if (subEl) subEl.textContent = "";
    var filterInput = document.getElementById("countryFilter");
    var filterBtn = document.getElementById("countryFilterBtn");
    var cityInput = document.getElementById("cityFilter");
    filterInput.placeholder = tr("country_filter_placeholder");
    filterBtn.textContent = tr("search_btn");
    cityInput.placeholder = tr("city_filter_placeholder");
    // The city picker on the home page has already asked which city, and
    // arriving here to an empty filter would throw that answer away and show
    // the whole world again. Country comes as an ISO code from the same
    // picker; the filter matches on names, so it is turned back into one.
    var wantCity = params.get("city");
    var wantCc = params.get("cc");
    if (wantCity) { cityInput.value = wantCity; cityFilter = wantCity.trim(); }
    if (wantCc && window.RotaboCountries && window.RotaboCountries.nameForIso) {
      var ccName = window.RotaboCountries.nameForIso(wantCc);
      if (ccName) { filterInput.value = ccName; countryFilter = ccName; }
    }
    function applyFilter(){
      countryFilter = filterInput.value.trim();
      cityFilter = cityInput.value.trim();
      loadListings();
    }
    filterInput.addEventListener("input", function(){
      narrowCityListToCountry(filterInput.value);
      applyFilter();
    });
    filterInput.addEventListener("keydown", function(e){
      if (e.key === "Enter") { e.preventDefault(); applyFilter(); }
    });
    filterBtn.addEventListener("click", applyFilter);
    cityInput.addEventListener("input", applyFilter);
    cityInput.addEventListener("keydown", function(e){
      if (e.key === "Enter") { e.preventDefault(); applyFilter(); }
    });
    // Same fix as the registration forms: a <datalist> input that
    // already holds a full value won't reopen with the full option
    // list on refocus in most browsers -- clear it on focus so it
    // does, restoring the previous value on blur if nothing new was
    // picked.
    [filterInput, cityInput].forEach(function(input){
      var previousValue = "";
      input.addEventListener("focus", function(){
        previousValue = input.value;
        input.value = "";
      });
      input.addEventListener("blur", function(){
        if (!input.value.trim() && previousValue) {
          input.value = previousValue;
          // Putting the text back is not enough: focus blanked the box
          // without an input event, so anything that ran applyFilter in
          // between (Enter, or typing and deleting a character) left the
          // globals empty while the box reads "Switzerland". The list --
          // and every 5s poll after it -- then showed every country
          // under a filter the user could see but not clear. Re-apply
          // what the box now says, so the two can never disagree.
          narrowCityListToCountry(filterInput.value);
          applyFilter();
        }
      });
    });
    loadListings();
    if (!listPollTimer) {
      listPollTimer = setInterval(loadListings, LIST_POLL_MS);
    }
  }

  function viewerToken(){ return window.RotaboViewer ? window.RotaboViewer.token() : null; }

  // The dashboard belongs to whoever paid; everyone else gets the locked
  // card. browse_public enforces the same thing server-side -- this only
  // decides which page to draw.
  function renderGateOrDashboard(){
    if (!window.RotaboViewer) { renderLocked(); return; }
    // Straight back from a checkout: hand over to the modal, which polls
    // for the access row Stripe's webhook is still writing, rather than
    // showing the price to someone who has just paid it.
    if (window.RotaboViewer.justPaid()) {
      renderLocked();
      window.RotaboViewer.open(function(){ renderDashboard(); }, category);
      return;
    }
    // Same for a return from Google: the page left and came back, so the
    // modal the visitor was standing in no longer exists and they would be
    // looking at the locked card again, signed in, with nothing to show
    // for it. open() trades the session for a viewer token by itself, so
    // re-opening is the whole fix.
    if (window.RotaboViewer.justSignedIn()) {
      renderLocked();
      window.RotaboViewer.open(function(){ renderDashboard(); }, category);
      return;
    }
    // The category is the whole question now: access is bought one
    // category at a time, so someone who unlocked Drive must still see
    // the locked card on Care.
    window.RotaboViewer.checkAccess(category).then(function(ok){
      if (ok) renderDashboard(); else renderLocked();
    });
  }

  // One tier, priced in CHF with the visitor's own currency beside it --
  // read from the strings the unlock modal uses, so the page in front of
  // the modal can never quote a different number than the modal itself.
  function tierText(key, fallback, chf){
    var v = (window.__dict && window.__dict.viewer) || {};
    var label = v[key] || fallback;
    var approx = window.RotaboFx ? window.RotaboFx.approx(chf) : "";
    return approx ? label + "  " + approx : label;
  }
  function fillTiers(el){
    if (!el) return;
    // One tier since 2026-08-22. This used to write two spans, 1 CHF and
    // 2 CHF, and it is a separate code path from the modal's own price
    // list -- so when the 1 CHF month was dropped from viewer.js, this
    // card went on quoting it. Whatever this shows, the modal behind the
    // button must show the same, which is why both read the same string.
    el.innerHTML = '<span></span>';
    el.querySelector("span").textContent = tierText("tier12", "2 CHF — 1 year", 2);
  }

  // What a stranger sees. Names, cities and numbers are all part of what
  // the payment buys now, so the only thing this page gives away is the
  // headcount -- which is also the guard against charging for an empty
  // category: at zero there is nothing to sell and no button to press.
  function renderLocked(){
    if (listPollTimer) { clearInterval(listPollTimer); listPollTimer = null; }
    lastBrowseSig = null;
    content.innerHTML =
      '<div class="my-listing" id="myListing"></div>' +
      '<div class="locked-card">' +
      '<div class="lock">🔒</div>' +
      '<p class="locked-count"></p>' +
      '<p class="locked-body"></p>' +
      '<p class="locked-price"></p>' +
      '<button type="button" class="locked-btn"></button>' +
      '</div>';
    renderMyListing();
    var card = content.querySelector(".locked-card");
    var countEl = card.querySelector(".locked-count");
    var bodyEl = card.querySelector(".locked-body");
    var priceEl = card.querySelector(".locked-price");
    var btn = card.querySelector(".locked-btn");
    bodyEl.textContent = tr("locked_body");
    fillTiers(priceEl);
    btn.textContent = tr("locked_btn");
    btn.addEventListener("click", function(){
      if (!window.RotaboViewer) {
        // viewer.js failed to load (blocked script, a bad cache entry).
        // A button that does nothing at all is worse than one that says
        // so by trying again: a reload re-fetches it.
        location.reload();
        return;
      }
      window.RotaboViewer.open(function(){ renderDashboard(); }, category);
    });
    // Registered once for the life of the page, not once per render:
    // renderLocked can run again (access lapses, a checkout comes back)
    // and every extra listener kept a detached node alive for nothing.
    if (!fxRedrawBound && window.RotaboFx && window.RotaboFx.onChange) {
      fxRedrawBound = true;
      window.RotaboFx.onChange(function(){
        var el = document.querySelector(".locked-price");
        if (el) fillTiers(el);
      });
    }
    sb.rpc("browse_count", { p_category: category, p_role: browseRole }).then(function(res){
      if (!document.body.contains(countEl)) return;
      // A failed count is not "nobody": leave the headline empty and keep
      // the unlock button, rather than telling a full category it is bare.
      if (res.error || typeof res.data !== "number") { countEl.remove(); return; }
      if (res.data === 0) {
        card.innerHTML = '<p class="locked-count"></p><a class="home-link" href="/"></a>';
        card.querySelector(".locked-count").textContent = tr("locked_empty");
        card.querySelector(".home-link").textContent = tr("register_link");
        return;
      }
      countEl.textContent = res.data === 1
        ? tr("locked_count_one")
        : tr("locked_count_other", { n: res.data });
    });
  }

  var lastBrowseSig = null;
  var loadListingsRequestId = 0;
  function loadListings(){
    var requestId = ++loadListingsRequestId;
    sb.rpc("browse_public", { p_category: category, p_role: browseRole, p_token: viewerToken() })
      .then(function(res){
      // A later filter change or poll tick may have started a newer
      // request that resolves before this one -- discard stale results.
      if (requestId !== loadListingsRequestId) return;
      var list = document.getElementById("requestList");
      if (!list) return;
      if (res.error) return;

      var rows = res.data || [];
      // Access can lapse while the page is open: the viewer session is
      // minted capped at the paid-access expiry, so it dies with it and
      // browse_public goes quiet. Zero rows with no credential left is
      // not an empty category, it is the paywall closing again.
      if (rows.length === 0 && !viewerToken()) { renderLocked(); return; }
      // Country/city filtering is done client-side over the public
      // projection (no private fields ever leave the server unfiltered).
      // Match without diacritics, both ways. The filters compared the typed
      // text to the stored text literally, so "Zurich" never found "Zürich",
      // "Munchen" never found "München" and "Targu" never found "Târgu Jiu" --
      // and people type the plain form, because that is what is on the
      // keyboard in front of them. NFD splits an accented letter into the
      // letter plus its mark; dropping the marks leaves the letter. Country
      // still prefers the ISO code when countries.js can resolve one, which
      // is what makes "Elveția" and "Svizzera" the same place; this is the
      // fallback for everything it cannot resolve, and the whole of what the
      // city field has.
      // A few letters are not an ASCII letter plus a mark, so NFD leaves them
      // whole: Polish Ł, Scandinavian Ø, Croatian Đ, German ß, the Æ/Œ
      // ligatures. Without these, "Lodz" still misses "Łódź".
      var LETTERS = { "\u0142":"l", "\u00f8":"o", "\u0111":"d", "\u00df":"ss",
                      "\u00e6":"ae", "\u0153":"oe", "\u0131":"i", "\u00fe":"th" };
      function fold(v){
        return (v || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[\u0142\u00f8\u0111\u00df\u00e6\u0153\u0131\u00fe]/g, function(c){ return LETTERS[c]; });
      }
      if (countryFilter) {
        // Match on the canonical code when both sides resolve to one, so
        // "Switzerland" also finds listings saved as "Svizzera" or
        // "Elvetia". Falls back to the old substring match for rows with
        // no code yet, or a filter spelling the map doesn't know.
        var wantIso = window.RotaboCountries ? window.RotaboCountries.isoFor(countryFilter) : "";
        var cf = fold(countryFilter);
        rows = rows.filter(function(r){
          if (wantIso && r.country_code) return r.country_code === wantIso;
          return fold(r.country).indexOf(cf) !== -1;
        });
      }
      if (cityFilter) {
        var cyf = fold(cityFilter);
        rows = rows.filter(function(r){ return fold(r.city).indexOf(cyf) !== -1; });
      }
      // Skip re-render when the filtered result is unchanged, so an unlocked
      // card's revealed contact details aren't wiped by the 5s poll.
      var sig = JSON.stringify(rows);
      if (sig === lastBrowseSig) return;
      lastBrowseSig = sig;
      if (rows.length === 0) {
        list.innerHTML = '<p class="empty-note"></p>';
        list.querySelector(".empty-note").textContent = tr("empty_note");
        return;
      }

      list.innerHTML = "";
      rows.forEach(function(row){
        var card = document.createElement("div");
        card.className = "request-card";
        card.innerHTML =
          '<div class="request-info">'
          + '<div class="name"></div>'
          + '<div class="city"></div>'
          + '<div class="address" hidden></div>'
          + '<div class="note" hidden></div>'
          + '</div>'
          + '<div class="contact-actions">'
          + '<button type="button" class="call-btn unlock-btn"></button>'
          + '<a class="call-btn tel-btn" hidden></a>'
          + '<a class="email-btn addr-email" hidden></a>'
          + '</div>';
        card.querySelector(".name").textContent = "#" + row.number + "  " + row.name;
        var location = [row.city, row.country].filter(Boolean).join(", ");
        card.querySelector(".city").textContent = location + " · " + timeAgo(row.created_at);
        // Contact details (phone/address/email/note) stay hidden until the
        // viewer unlocks paid access -- served only via get_listing_details_by_id.
        var unlockBtn = card.querySelector(".unlock-btn");
        unlockBtn.textContent = tr("unlock_btn");
        unlockBtn.addEventListener("click", function(){
          if (!window.RotaboViewer) return;
          window.RotaboViewer.reveal({ id: row.id, onDetails: function(details){
            // By id, not by number. rotabo_numbers is joined on the listing's
            // email, so `number` identifies a PERSON: someone with two
            // listings in one category appeared as two cards carrying the same
            // number, get_listing_details answered for both, and there was
            // nothing in the reply to tell them apart -- so both cards showed
            // whichever row happened to come first, and one listing's note was
            // simply unreachable. browse_public now returns the listing's own
            // id and get_listing_details_by_id answers for exactly that one,
            // behind the same paywall.
            var d = (details || [])[0];
            if (!d) return;
            unlockBtn.hidden = true;
            var addressEl = card.querySelector(".address");
            if (d.address) { addressEl.textContent = d.address; addressEl.hidden = false; }
            var noteEl = card.querySelector(".note");
            if (d.note) { noteEl.textContent = d.note; noteEl.hidden = false; }
            var telBtn = card.querySelector(".tel-btn");
            if (d.phone) { telBtn.href = "tel:" + d.phone; telBtn.textContent = tr("call_btn"); telBtn.hidden = false; }
            var emailBtn = card.querySelector(".addr-email");
            if (d.email) { emailBtn.href = "mailto:" + d.email; emailBtn.textContent = tr("email_btn"); emailBtn.hidden = false; }
          }});
        });
        list.appendChild(card);
      });
    });
  }

  // A checkout that was never completed leaves a listings row with no
  // stripe_session_id forever, and index.html stored its id before the
  // browser ever left for Stripe. Polling it without a limit turned this
  // page into a permanent spinner for that category: no headcount, no
  // locked card, no way to buy viewer access, and a get_listing_status
  // every 3 seconds for as long as the tab stayed open. Give the wait a
  // ceiling, then forget the id and show the page everyone else gets.
  var PENDING_POLL_MS = 3000;
  var PENDING_POLL_MAX = 40;   // ~2 minutes, well past a normal webhook
  function forgetListing(){
    listingId = null;
    try { localStorage.removeItem("rotabo_listing_" + category + "_" + myRole); } catch (e) {}
  }
  function checkStatusAndRender(tries){
    tries = tries || 0;
    sb.rpc("get_listing_status", { p_id: listingId })
      .maybeSingle()
      .then(function(res){
        if (res.error || !res.data) {
          listingId = null;
          renderGateOrDashboard();
          return;
        }
        // FREE LISTING PERIOD, from 2026-08-22: create-listing sets
        // visible_until itself and no checkout follows, so stripe_session_id
        // is null on every listing published since. This test used to read
        // that null as "payment not confirmed yet", which meant every single
        // person who published a free listing landed here from
        // after-payment.html and was shown "Confirming your payment…" for two
        // minutes -- for a payment that never existed and was never asked
        // for -- at the exact moment they had just succeeded. The signal that
        // a listing is live is visible_until, and always was.
        var vu = res.data.visible_until;
        var live = vu && new Date(vu).getTime() > Date.now();
        if (!live) {
          if (tries >= PENDING_POLL_MAX) {
            // Either abandoned at Stripe or a webhook that is never
            // coming. Either way this is not a payment being confirmed.
            forgetListing();
            renderGateOrDashboard();
            return;
          }
          renderPendingConfirmation();
          setTimeout(function(){ checkStatusAndRender(tries + 1); }, PENDING_POLL_MS);
          return;
        }
        renderGateOrDashboard();
      });
  }
  function init(){
    if (listingId) {
      checkStatusAndRender();
      return;
    }

    // No record of a listing on this browser -- if the visitor is logged
    // into an account (see account.html), look up their most recent
    // listing for this category/role there instead, so the page works
    // the same way from any device, not just the one they paid on.
    sb.auth.getSession().then(function(sessionRes){
      var session = sessionRes.data && sessionRes.data.session;
      if (!session) {
        renderGateOrDashboard();
        return;
      }
      // Only a listing that was actually paid for. Ordering by created_at
      // alone handed back an abandoned checkout whenever someone
      // re-submitted the form on top of a live listing, and the line
      // below then wrote that pending id into this device's storage --
      // spreading the "Confirming your payment…" spinner from the device
      // that walked away from Stripe to every other device they log in on.
      sb.from("listings")
        .select("id")
        .eq("category", category)
        .eq("role", myRole)
        .eq("user_id", session.user.id)
        // Same correction as above: a free listing carries no stripe
        // session, so filtering on one meant a signed-in lister never found
        // their own listing on a second device.
        .gt("visible_until", new Date().toISOString())
        .order("created_at", { ascending: false })
        .limit(1)
        .maybeSingle()
        .then(function(res){
          if (res.error || !res.data) {
            renderGateOrDashboard();
            return;
          }
          listingId = res.data.id;
          try { localStorage.setItem("rotabo_listing_" + category + "_" + myRole, listingId); } catch (e) {}
          checkStatusAndRender();
        });
    });
  }

  loadTranslations().then(init);
})();
</script>

<script>
(function(){
  try {
    var sid = localStorage.getItem("rotabo_sid");
    if (!sid) { sid = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(16).slice(2))); localStorage.setItem("rotabo_sid", sid); }
    // Visitor country, read from Cloudflare's own trace endpoint on this
    // origin -- no third-party geo service and no IP kept. Anything that
    // is not a plain two-letter code (Tor reports "T1", a dev server has
    // no Cloudflare in front of it) is stored as unknown. Cached for the
    // session so only the first page load pays for the extra request.
    function visitorCountry(){
      var cached = null;
      try { cached = sessionStorage.getItem("rotabo_geo"); } catch (e) {}
      if (cached !== null) return Promise.resolve(cached || null);
      return fetch("/cdn-cgi/trace", { cache: "no-store" })
        .then(function(res){ return res.ok ? res.text() : ""; })
        .then(function(txt){
          var m = /(?:^|\n)loc=([A-Z]{2})(?:\r?\n|$)/.exec(txt || "");
          var code = m ? m[1] : "";
          try { sessionStorage.setItem("rotabo_geo", code); } catch (e) {}
          return code || null;
        })
        .catch(function(){ return null; });
    }

    // The visits table stores the query string, and account.html is where
    // a password-recovery link lands with its token in that query string.
    // Analytics is not a place to write down credentials, so anything
    // that looks like one is dropped before the row is sent. gclid stays:
    // the paid/organic split is derived from it.
    function safePath(){
      try {
        var u = new URL(location.href);
        ["code","token","token_hash","access_token","refresh_token","otp","secret","password","email_otp"].forEach(function(k){ u.searchParams.delete(k); });
        return u.pathname + (u.search || "");
      } catch (e) { return location.pathname; }
    }

    visitorCountry().then(function(country){
      fetch("https://auth.rotabo.app/rest/v1/site_visits", {

          "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhcWZicHp3ZGdud2pvYWVkanJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDkwMzgsImV4cCI6MjEwMTc4NTAzOH0.nds6gT2P32WT0wKoeCFAWuGLX3oipGKtvuU2mwdxi3w",

        body: JSON.stringify({ path: safePath(), referrer: document.referrer || null, language: navigator.language || null, session_id: sid, country: country }),

})();
