# selfies.lol on Cloudflare Workers, serving the files in ./public.
#
# The custom_domain routes for selfies.lol and www.selfies.lol were removed
# 2026-09-10: a separate, independently-built application ("selfies-lol-web")
# is meant to serve that domain, and this Worker had been holding the Custom
# Domain hostnames since it first deployed on 2026-09-08, before that other
# system was even created -- so it could never attach. This Worker now only
# runs at its *.workers.dev address, for whatever still points at it directly.
#
# Deploy:  npm run deploy          (needs a Cloudflare API token, see README)
# Try:     npm run dev             (http://localhost:8787)

name = "selfies-lol"
main = "src/worker.js"
compatibility_date = "2026-09-07"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# The worker runs before the asset lookup, so www.selfies.lol can be sent to
# the apex and every response can carry the security headers. It costs one
# function call per request and nothing more: static files still come from
# the asset store.
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[observability]
enabled = true

[vars]
SUPABASE_URL = "https://uwpsdbymmwwoeltlvtic.supabase.co"
# SUPABASE_SERVICE_ROLE_KEY: never here. `npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY`
