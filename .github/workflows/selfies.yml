# selfies.lol: tell the crawlers after a push that changed the site.
#
# Runs only when something under selfies/ changed. The rotabo site at the
# repository root is GitHub Pages and has its own workflow (indexnow.yml).
#
# The Worker itself is no longer deployed from here: Cloudflare Workers Builds
# is connected to this repository (branch main, root directory selfies/,
# watch path selfies/**) and runs `npx wrangler deploy` on every push. That
# build takes about a minute, so this job waits before submitting, otherwise
# IndexNow would be told about pages the crawler then finds unchanged.

name: selfies.lol

on:
  push:
    branches: [main]
    paths:
      - 'selfies/**'
      - '.github/workflows/selfies.yml'
      - 'scripts/indexnow.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfies
  cancel-in-progress: false

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for Workers Builds to deploy
        run: sleep 120

      - name: Submit to IndexNow
        env:
          INDEXNOW_HOST: selfies.lol
          INDEXNOW_KEY: 4239de776831bf877ed25e870b96aa4c
          INDEXNOW_DIR: selfies/public/
          INDEXNOW_BEFORE: ${{ github.event.before }}
        run: node scripts/indexnow.mjs
