# selfies.lol: deploy the Worker in /selfies, then tell the crawlers.
#
# Runs only when something under selfies/ changed. The rotabo site at the
# repository root is GitHub Pages and has its own workflow (indexnow.yml).
#
# Needs two repository secrets, both from the Cloudflare dashboard:
#   CLOUDFLARE_API_TOKEN   a token with "Workers Scripts: Edit" and
#                          "Workers Custom Domains: Edit" on the account
#   CLOUDFLARE_ACCOUNT_ID  Workers & Pages > Overview, right-hand column
#
# The custom-domain routes in selfies/wrangler.toml need the selfies.lol zone
# to be active in Cloudflare first; until then this job fails at deploy, by
# design, rather than publishing to nowhere. See selfies/README.md.

name: selfies.lol

on:
  push:
    branches: [main]
    paths:
      - 'selfies/**'
      - '.github/workflows/selfies.yml'
      - 'scripts/indexnow.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfies
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selfies
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install --no-audit --no-fund

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Submit to IndexNow
        working-directory: .
        env:
          INDEXNOW_HOST: selfies.lol
          INDEXNOW_KEY: 4239de776831bf877ed25e870b96aa4c
          INDEXNOW_DIR: selfies/public/
          INDEXNOW_BEFORE: ${{ github.event.before }}
        run: node scripts/indexnow.mjs
