<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find a driver — Rotabo</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
  :root{
    --bg-top:#f6ecf9;
    --bg-mid:#f3e6f8;
    --bg-card:#f7edfa;
    --border:#e2c3ee;
    --violet-1:#7c2d9c;
    --violet-2:#9b3fc0;
    --text-dark:#3a1650;
    --text-body:#6b5878;
    --text-eyebrow:#8a7a94;
    --green:#3ecb7e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background:linear-gradient(180deg,var(--bg-top) 0%, var(--bg-mid) 40%, var(--bg-mid) 100%);
    color:var(--text-body);
  }
  header{border-bottom:1px solid var(--border);background:linear-gradient(180deg,#f8eefb,#f4e8f8);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;max-width:1080px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.6rem;color:var(--violet-1);text-decoration:none;}
  .brand svg{width:24px;height:31px;filter:drop-shadow(0 4px 10px rgba(124,37,150,.25));}

  .wrap{max-width:640px;margin:0 auto;padding:48px 24px 80px;}
  .eyebrow{color:var(--text-eyebrow);letter-spacing:.1em;font-size:.82rem;font-weight:700;margin-bottom:10px;}
  h1{color:var(--text-dark);font-size:1.7rem;margin:0 0 8px;}
  .sub{color:var(--text-body);font-size:1rem;margin:0 0 32px;}

  .state-card{
    background:var(--bg-card);border:1px solid var(--border);
    border-radius:20px;padding:36px;text-align:center;
  }
  .spinner{
    width:44px;height:44px;margin:0 auto 20px;
    border-radius:50%;border:4px solid var(--border);border-top-color:var(--violet-2);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .home-link{display:inline-block;margin-top:20px;color:var(--violet-2);font-weight:700;text-decoration:none;}

  .filter-field{margin-bottom:18px;}
  .city-filter{
    width:100%;padding:12px 14px;border-radius:10px;
    border:1px solid var(--border);background:#fff;
    color:var(--text-dark);font-size:1rem;font-family:inherit;box-sizing:border-box;
  }
  .city-filter:focus{outline:2px solid var(--violet-2);outline-offset:1px;}

  .request-list{display:flex;flex-direction:column;gap:14px;}
  .request-card{
    background:#fff;border:1px solid var(--border);border-radius:16px;
    padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .request-info .name{font-weight:800;color:var(--text-dark);font-size:1.05rem;}
  .request-info .city{color:var(--text-eyebrow);font-size:.9rem;margin-top:3px;}
  .call-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:linear-gradient(135deg,#9b2fbf,#7c2596);color:#fff;
    border:none;border-radius:12px;padding:11px 20px;
    font-weight:800;font-size:.95rem;text-decoration:none;flex-shrink:0;
  }
  .empty-note{color:var(--text-eyebrow);text-align:center;padding:24px 0;}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <radialGradient id="diamondGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#c264e0"/>
      <stop offset="55%" stop-color="#a239c9"/>
      <stop offset="100%" stop-color="#7c2596"/>
    </radialGradient>
    <path id="diamondShape" d="M118.15,28.88 Q100,5 81.85,28.88 L23.15,106.12 Q5,130 23.15,153.88 L81.85,231.12 Q100,255 118.15,231.12 L176.85,153.88 Q195,130 176.85,106.12 Z"/>
  </defs>
</svg>

<header>
  <div class="nav-inner">
    <a class="brand" href="/">
      <svg viewBox="0 0 200 260"><use xlink:href="#diamondShape" href="#diamondShape" fill="url(#diamondGrad)"/></svg>
      Rotabo
    </a>
  </div>
</header>

<div class="wrap">
  <p class="eyebrow" id="pageEyebrow">FIND A DRIVER</p>
  <h1 id="pageTitle">Drivers near you</h1>
  <p class="sub" id="pageSub">Everyone currently visible. Filter by city if you like.</p>

  <div id="content">
    <div class="state-card">
      <div class="spinner"></div>
      <p id="loadingText">Loading…</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var SUPABASE_URL = "https://caqfbpzwdgnwjoaedjrg.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhcWZicHp3ZGdud2pvYWVkanJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDkwMzgsImV4cCI6MjEwMTc4NTAzOH0.nds6gT2P32WT0wKoeCFAWuGLX3oipGKtvuU2mwdxi3w";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    global: { fetch: function(url, options){ return fetch(url, Object.assign({}, options, { cache: "no-store" })); } }
  });
  var LIST_POLL_MS = 5000;

  // Minimal i18n: reuse the language the visitor already chose on the
  // homepage (persisted in localStorage). No language switcher here on
  // purpose -- this is a working tool for someone who just paid, not a
  // marketing page.
  var LANG = localStorage.getItem("rotabo_lang") || "en";
  var T = {
    eyebrow: "FIND A DRIVER",
    title: "Drivers near you",
    subtitle: "Everyone currently visible. Filter by city if you like.",
    loading: "Loading…",
    not_registered_body: "You don’t have an active listing on this device yet.",
    register_link: "← Back to home",
    pending_confirmation: "Confirming your payment…",
    empty_note: "No drivers visible right now. This list refreshes automatically.",
    call_btn: "📞 Call",
    city_filter_placeholder: "Filter by city…",
    time_just_now: "just now",
    time_min_ago_one: "1 min ago",
    time_min_ago_other: "{n} min ago",
    time_hour_ago_one: "1 hour ago",
    time_hour_ago_other: "{n} hours ago"
  };

  function tr(key, vars){
    var str = T[key];
    if (vars) {
      Object.keys(vars).forEach(function(k){
        str = str.split("{" + k + "}").join(vars[k]);
      });
    }
    return str;
  }

  function loadTranslations(){
    return fetch("locales/" + LANG + ".json")
      .then(function(res){ return res.ok ? res.json() : null; })
      .then(function(dict){
        if (dict && dict.find_dashboard_page) {
          Object.assign(T, dict.find_dashboard_page);
        }
        document.getElementById("pageEyebrow").textContent = T.eyebrow;
        document.getElementById("pageTitle").textContent = T.title;
        document.getElementById("pageSub").textContent = T.subtitle;
        document.getElementById("loadingText").textContent = T.loading;
      })
      .catch(function(){ /* keep English defaults */ });
  }

  var clientListingId = localStorage.getItem("rotabo_client_listing_id");
  var content = document.getElementById("content");
  var listPollTimer = null;
  var cityFilter = "";

  function renderNotRegistered(){
    content.innerHTML =
      '<div class="state-card">' +
      '<p></p>' +
      '<a class="home-link" href="/"></a>' +
      '</div>';
    content.querySelector("p").textContent = tr("not_registered_body");
    content.querySelector(".home-link").textContent = tr("register_link");
  }

  function renderPendingConfirmation(){
    content.innerHTML =
      '<div class="state-card">' +
      '<div class="spinner"></div>' +
      '<p></p>' +
      '</div>';
    content.querySelector("p").textContent = tr("pending_confirmation");
  }

  function timeAgo(iso){
    var diffMs = Date.now() - new Date(iso).getTime();
    var mins = Math.max(0, Math.round(diffMs / 60000));
    if (mins < 1) return tr("time_just_now");
    if (mins === 1) return tr("time_min_ago_one");
    if (mins < 60) return tr("time_min_ago_other", { n: mins });
    var hrs = Math.round(mins / 60);
    return hrs === 1 ? tr("time_hour_ago_one") : tr("time_hour_ago_other", { n: hrs });
  }

  function renderDashboard(){
    content.innerHTML =
      '<div class="filter-field"><input type="text" id="cityFilter" class="city-filter"></div>' +
      '<div class="request-list" id="requestList"></div>';
    var filterInput = document.getElementById("cityFilter");
    filterInput.placeholder = tr("city_filter_placeholder");
    filterInput.addEventListener("input", function(){
      cityFilter = this.value.trim();
      loadListings();
    });
    loadListings();
    if (!listPollTimer) {
      listPollTimer = setInterval(loadListings, LIST_POLL_MS);
    }
  }

  function loadListings(){
    var query = sb.from("driver_listings")
      .select("id, name, city, phone, created_at")
      .order("created_at", { ascending: false });
    if (cityFilter) query = query.ilike("city", "%" + cityFilter + "%");

    query.then(function(res){
      var list = document.getElementById("requestList");
      if (!list) return;
      if (res.error) return;

      var rows = res.data || [];
      if (rows.length === 0) {
        list.innerHTML = '<p class="empty-note"></p>';
        list.querySelector(".empty-note").textContent = tr("empty_note");
        return;
      }

      list.innerHTML = "";
      rows.forEach(function(row){
        var card = document.createElement("div");
        card.className = "request-card";
        card.innerHTML =
          '<div class="request-info">'
          + '<div class="name"></div>'
          + '<div class="city"></div>'
          + '</div>'
          + '<a class="call-btn"></a>';
        card.querySelector(".name").textContent = row.name;
        card.querySelector(".city").textContent = row.city + " · " + timeAgo(row.created_at);
        var callBtn = card.querySelector(".call-btn");
        callBtn.href = "tel:" + row.phone;
        callBtn.textContent = tr("call_btn");
        list.appendChild(card);
      });
    });
  }

  function init(){
    if (!clientListingId) {
      renderNotRegistered();
      return;
    }

    sb.from("client_listing_status")
      .select("id, stripe_session_id, visible_until")
      .eq("id", clientListingId)
      .maybeSingle()
      .then(function(res){
        if (res.error || !res.data) {
          renderNotRegistered();
          return;
        }
        if (!res.data.stripe_session_id) {
          renderPendingConfirmation();
          setTimeout(init, 3000);
          return;
        }
        renderDashboard();
      });
  }

  loadTranslations().then(init);
})();
</script>

</body>
</html>
