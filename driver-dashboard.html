<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver dashboard — Rotabo</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
  :root{
    --bg-top:#f6ecf9;
    --bg-mid:#f3e6f8;
    --bg-card:#f7edfa;
    --border:#e2c3ee;
    --violet-1:#7c2d9c;
    --violet-2:#9b3fc0;
    --text-dark:#3a1650;
    --text-body:#6b5878;
    --text-eyebrow:#8a7a94;
    --green:#3ecb7e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background:linear-gradient(180deg,var(--bg-top) 0%, var(--bg-mid) 40%, var(--bg-mid) 100%);
    color:var(--text-body);
  }
  header{border-bottom:1px solid var(--border);background:linear-gradient(180deg,#f8eefb,#f4e8f8);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;max-width:1080px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.6rem;color:var(--violet-1);text-decoration:none;}
  .brand svg{width:24px;height:31px;filter:drop-shadow(0 4px 10px rgba(124,37,150,.25));}

  .wrap{max-width:640px;margin:0 auto;padding:48px 24px 80px;}
  .eyebrow{color:var(--text-eyebrow);letter-spacing:.1em;font-size:.82rem;font-weight:700;margin-bottom:10px;}
  h1{color:var(--text-dark);font-size:1.7rem;margin:0 0 8px;}
  .sub{color:var(--text-body);font-size:1rem;margin:0 0 32px;}

  .state-card{
    background:var(--bg-card);border:1px solid var(--border);
    border-radius:20px;padding:36px;text-align:center;
  }
  .spinner{
    width:44px;height:44px;margin:0 auto 20px;
    border-radius:50%;border:4px solid var(--border);border-top-color:var(--violet-2);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .home-link{display:inline-block;margin-top:20px;color:var(--violet-2);font-weight:700;text-decoration:none;}

  .request-list{display:flex;flex-direction:column;gap:14px;}
  .request-card{
    background:#fff;border:1px solid var(--border);border-radius:16px;
    padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .request-info .name{font-weight:800;color:var(--text-dark);font-size:1.05rem;}
  .request-info .city{color:var(--text-eyebrow);font-size:.9rem;}
  .request-info .fare{color:var(--violet-1);font-weight:800;font-size:.86rem;margin-top:3px;}
  .accept-btn{
    background:linear-gradient(135deg,#9b2fbf,#7c2596);color:#fff;
    border:none;border-radius:12px;padding:11px 20px;
    font-weight:800;font-size:.95rem;cursor:pointer;flex-shrink:0;
  }
  .accept-btn:disabled{opacity:.6;cursor:not-allowed;}
  .empty-note{color:var(--text-eyebrow);text-align:center;padding:24px 0;}
  .taken-note{color:#c0392b;font-size:.9rem;margin-top:10px;display:none;text-align:center;}
  .taken-note.show{display:block;}

  .active-ride{
    background:var(--bg-card);border:1px solid var(--border);
    border-radius:20px;padding:28px;margin-bottom:28px;
  }
  .active-ride .cat{color:var(--text-eyebrow);letter-spacing:.1em;font-size:.78rem;font-weight:700;margin-bottom:10px;}
  .active-ride .name{font-weight:800;color:var(--text-dark);font-size:1.2rem;margin-bottom:4px;}
  .active-ride .city{color:var(--text-eyebrow);font-size:.92rem;margin-bottom:4px;}
  .active-ride .fare-line{color:var(--violet-1);font-weight:800;font-size:.9rem;margin-bottom:18px;}
  .active-ride .actions{display:flex;gap:12px;flex-wrap:wrap;}
  .active-ride .phone-btn, .active-ride .nav-btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:12px 18px;border-radius:12px;font-weight:800;font-size:.95rem;
    text-decoration:none;border:none;cursor:pointer;
  }
  .active-ride .phone-btn{background:#fff;border:1px solid var(--border);color:var(--violet-1);}
  .active-ride .nav-btn{background:linear-gradient(135deg,#9b2fbf,#7c2596);color:#fff;}
  .active-ride .loc-note{color:var(--text-eyebrow);font-size:.85rem;margin-top:14px;}
  .active-ride .cancel-btn{
    background:none;border:none;color:var(--text-eyebrow);font-size:.85rem;
    font-family:inherit;text-decoration:underline;cursor:pointer;
    margin-top:16px;padding:4px;display:block;
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <radialGradient id="diamondGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#c264e0"/>
      <stop offset="55%" stop-color="#a239c9"/>
      <stop offset="100%" stop-color="#7c2596"/>
    </radialGradient>
    <path id="diamondShape" d="M118.15,28.88 Q100,5 81.85,28.88 L23.15,106.12 Q5,130 23.15,153.88 L81.85,231.12 Q100,255 118.15,231.12 L176.85,153.88 Q195,130 176.85,106.12 Z"/>
  </defs>
</svg>

<header>
  <div class="nav-inner">
    <a class="brand" href="/">
      <svg viewBox="0 0 200 260"><use xlink:href="#diamondShape" href="#diamondShape" fill="url(#diamondGrad)"/></svg>
      Rotabo
    </a>
  </div>
</header>

<div class="wrap">
  <p class="eyebrow" id="pageEyebrow">DRIVER DASHBOARD</p>
  <h1 id="pageTitle">Open requests</h1>
  <p class="sub" id="pageSub">Requests currently searching for a driver in your city.</p>

  <div id="content">
    <div class="state-card">
      <div class="spinner"></div>
      <p id="loadingText">Loading…</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var SUPABASE_URL = "https://caqfbpzwdgnwjoaedjrg.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhcWZicHp3ZGdud2pvYWVkanJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDkwMzgsImV4cCI6MjEwMTc4NTAzOH0.nds6gT2P32WT0wKoeCFAWuGLX3oipGKtvuU2mwdxi3w";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    global: { fetch: function(url, options){ return fetch(url, Object.assign({}, options, { cache: "no-store" })); } }
  });
  var BECOME_DRIVER_LINK = "https://buy.stripe.com/6oUaEQ8B07IV8GGa4s0co04";
  var LIST_POLL_MS = 5000;

  // Minimal i18n: reuse the language the visitor already chose on the
  // homepage (persisted in localStorage). No language switcher here on
  // purpose -- this is a working tool for a registered driver, not a
  // marketing page.
  var LANG = localStorage.getItem("rotabo_lang") || "en";
  var T = {
    eyebrow: "DRIVER DASHBOARD",
    title: "Open requests",
    subtitle: "Requests currently searching for a driver in {city}.",
    loading: "Loading…",
    not_registered_body: "You don’t have a driver profile on this device yet.",
    register_link: "← Go register as a driver",
    pending_confirmation: "Confirming your registration payment…",
    empty_note: "No open requests in your city right now. This list refreshes automatically.",
    accept_btn: "Accept",
    accept_checking: "Checking…",
    accept_taken: "Already taken",
    taken_note: "That request was just taken by another driver.",
    time_just_now: "just now",
    time_min_ago_one: "1 min ago",
    time_min_ago_other: "{n} min ago",
    time_hour_ago_one: "1 hour ago",
    time_hour_ago_other: "{n} hours ago",
    fare_for_you: "~{amount} CHF for you",
    active_ride_cat: "YOUR RIDE",
    active_ride_call: "📞 Call client",
    active_ride_navigate: "🧭 Navigate to pickup",
    active_ride_sharing_on: "Sharing your live location with the client.",
    active_ride_sharing_off: "Turn on location access in your browser to share your live position with the client.",
    active_ride_fare: "~{amount} CHF for this ride ({km} km), settled directly with the client",
    active_ride_cancel_btn: "Can't make it — release this ride",
    active_ride_cancel_confirm: "Release this ride? The client will be shown to other drivers again."
  };

  function tr(key, vars){
    var str = T[key];
    if (vars) {
      Object.keys(vars).forEach(function(k){
        str = str.split("{" + k + "}").join(vars[k]);
      });
    }
    return str;
  }

  function loadTranslations(){
    return fetch("locales/" + LANG + ".json")
      .then(function(res){ return res.ok ? res.json() : null; })
      .then(function(dict){
        if (dict && dict.dashboard_page) {
          Object.assign(T, dict.dashboard_page);
        }
        document.getElementById("pageEyebrow").textContent = T.eyebrow;
        document.getElementById("pageTitle").textContent = T.title;
        document.getElementById("loadingText").textContent = T.loading;
      })
      .catch(function(){ /* keep English defaults */ });
  }

  var driverId = localStorage.getItem("rotabo_driver_id");
  var content = document.getElementById("content");
  var listPollTimer = null;

  function renderNotRegistered(){
    content.innerHTML =
      '<div class="state-card">' +
      '<p></p>' +
      '<a class="home-link" href="/"></a>' +
      '</div>';
    content.querySelector("p").textContent = tr("not_registered_body");
    content.querySelector(".home-link").textContent = tr("register_link");
  }

  function renderPendingConfirmation(){
    content.innerHTML =
      '<div class="state-card">' +
      '<div class="spinner"></div>' +
      '<p></p>' +
      '</div>';
    content.querySelector("p").textContent = tr("pending_confirmation");
  }

  function timeAgo(iso){
    var diffMs = Date.now() - new Date(iso).getTime();
    var mins = Math.max(0, Math.round(diffMs / 60000));
    if (mins < 1) return tr("time_just_now");
    if (mins === 1) return tr("time_min_ago_one");
    if (mins < 60) return tr("time_min_ago_other", { n: mins });
    var hrs = Math.round(mins / 60);
    return hrs === 1 ? tr("time_hour_ago_one") : tr("time_hour_ago_other", { n: hrs });
  }

  function acceptRequest(requestId, btn){
    btn.disabled = true;
    btn.textContent = tr("accept_checking");

    sb.from("searching_requests").select("id").eq("id", requestId).maybeSingle().then(function(res){
      if (!res.data) {
        btn.textContent = tr("accept_taken");
        var note = document.getElementById("takenNote");
        if (note) note.classList.add("show");
        setTimeout(loadRequests, 800);
        return;
      }
      window.location.href = BECOME_DRIVER_LINK
        + "?client_reference_id=" + encodeURIComponent(driverId + ":" + requestId);
    }).catch(function(){
      btn.disabled = false;
      btn.textContent = tr("accept_btn");
    });
  }

  function renderDashboard(driverCity){
    var html = '<div class="request-list" id="requestList"></div>'
      + '<p class="taken-note" id="takenNote"></p>';
    content.innerHTML = html;
    document.getElementById("takenNote").textContent = tr("taken_note");
    loadRequests(driverCity);
    if (!listPollTimer) {
      listPollTimer = setInterval(function(){ loadRequests(driverCity); }, LIST_POLL_MS);
    }
  }

  var currentCity = null;

  function loadRequests(city){
    if (city) currentCity = city;
    if (!currentCity) return;

    sb.from("searching_requests")
      .select("id, client_name, city, destination_address, distance_km, estimated_fare_chf, created_at")
      .ilike("city", currentCity)
      .order("created_at", { ascending: true })
      .then(function(res){
        var list = document.getElementById("requestList");
        if (!list) return;
        if (res.error) return;

        var rows = res.data || [];
        if (rows.length === 0) {
          list.innerHTML = '<p class="empty-note"></p>';
          list.querySelector(".empty-note").textContent = tr("empty_note");
          return;
        }

        list.innerHTML = "";
        rows.forEach(function(row){
          var card = document.createElement("div");
          card.className = "request-card";
          card.innerHTML =
            '<div class="request-info">'
            + '<div class="name"></div>'
            + '<div class="city"></div>'
            + '<div class="fare"></div>'
            + '</div>'
            + '<button type="button" class="accept-btn"></button>';
          card.querySelector(".name").textContent = row.client_name;
          card.querySelector(".city").textContent = row.city + " · " + timeAgo(row.created_at);
          var fareEl = card.querySelector(".fare");
          if (row.estimated_fare_chf != null) {
            var driverShare = Math.round(row.estimated_fare_chf * 0.9 * 100) / 100;
            var text = tr("fare_for_you", { amount: driverShare.toFixed(2) });
            if (row.destination_address) text += " · " + row.destination_address;
            fareEl.textContent = text;
          } else {
            fareEl.remove();
          }
          var btn = card.querySelector(".accept-btn");
          btn.textContent = tr("accept_btn");
          btn.addEventListener("click", function(){ acceptRequest(row.id, btn); });
          list.appendChild(card);
        });
      });
  }

  var locationWatchId = null;

  // Broadcasts this driver's position to their active ride's row every
  // few seconds at most, so the client can see a live ETA. Only ever
  // runs while there's a matched ride -- the "matched ride live
  // location can be updated" RLS policy (and its trigger guard, which
  // rejects any change outside the location fields) only allows this
  // for rows currently in that state.
  function startLocationSharing(requestId){
    if (!navigator.geolocation || locationWatchId !== null) return;
    var lastSent = 0;
    var MIN_INTERVAL_MS = 4000;
    locationWatchId = navigator.geolocation.watchPosition(function(pos){
      var now = Date.now();
      if (now - lastSent < MIN_INTERVAL_MS) return;
      lastSent = now;
      sb.from("requests").update({
        driver_lat: pos.coords.latitude,
        driver_lng: pos.coords.longitude,
        driver_location_updated_at: new Date().toISOString()
      }).eq("id", requestId).then(function(){});
    }, function(){
      var note = document.getElementById("locNote");
      if (note) note.textContent = tr("active_ride_sharing_off");
    }, { enableHighAccuracy: true, maximumAge: 5000 });
  }

  function stopLocationSharing(){
    if (locationWatchId !== null && navigator.geolocation) {
      navigator.geolocation.clearWatch(locationWatchId);
      locationWatchId = null;
    }
  }

  function releaseRide(ride, btn){
    if (!window.confirm(tr("active_ride_cancel_confirm"))) return;
    btn.disabled = true;
    sb.from("requests").update({
      status: "searching",
      driver_id: null,
      driver_lat: null,
      driver_lng: null,
      driver_location_updated_at: null
    }).eq("id", ride.id).eq("driver_id", driverId).eq("status", "matched").select().then(function(res){
      if (res.error || !res.data || res.data.length === 0) {
        btn.disabled = false;
        return;
      }
      stopLocationSharing();
      init();
    }).catch(function(){ btn.disabled = false; });
  }

  function renderActiveRide(ride){
    content.innerHTML =
      '<div class="active-ride">' +
      '<div class="cat"></div>' +
      '<div class="name"></div>' +
      '<div class="city"></div>' +
      '<div class="fare-line"></div>' +
      '<div class="actions">' +
      '<a class="phone-btn" id="callBtn"></a>' +
      '<a class="nav-btn" id="navBtn" target="_blank" rel="noopener"></a>' +
      '</div>' +
      '<p class="loc-note" id="locNote"></p>' +
      '<button type="button" class="cancel-btn" id="releaseBtn"></button>' +
      '</div>';
    content.querySelector(".cat").textContent = tr("active_ride_cat");
    content.querySelector(".name").textContent = ride.client_name;
    content.querySelector(".city").textContent = ride.city + (ride.destination_address ? " → " + ride.destination_address : "");

    var fareLine = content.querySelector(".fare-line");
    if (ride.estimated_fare_chf != null) {
      var driverShare = Math.round(ride.estimated_fare_chf * 0.9 * 100) / 100;
      fareLine.textContent = tr("active_ride_fare", { amount: driverShare.toFixed(2), km: (ride.distance_km || 0).toFixed(1) });
    } else {
      fareLine.remove();
    }

    var callBtn = document.getElementById("callBtn");
    callBtn.href = "tel:" + ride.client_phone;
    callBtn.textContent = tr("active_ride_call");

    var navBtn = document.getElementById("navBtn");
    navBtn.href = (ride.pickup_lat != null && ride.pickup_lng != null)
      ? "https://www.google.com/maps/dir/?api=1&destination=" + ride.pickup_lat + "," + ride.pickup_lng
      : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(ride.city);
    navBtn.textContent = tr("active_ride_navigate");

    document.getElementById("locNote").textContent = tr("active_ride_sharing_on");
    startLocationSharing(ride.id);

    var releaseBtn = document.getElementById("releaseBtn");
    releaseBtn.textContent = tr("active_ride_cancel_btn");
    releaseBtn.addEventListener("click", function(){ releaseRide(ride, releaseBtn); });
  }

  function init(){
    if (!driverId) {
      renderNotRegistered();
      return;
    }

    sb.from("driver_public_info")
      .select("id, name, city, stripe_session_id")
      .eq("id", driverId)
      .maybeSingle()
      .then(function(res){
        if (res.error || !res.data) {
          renderNotRegistered();
          return;
        }
        if (!res.data.stripe_session_id) {
          renderPendingConfirmation();
          setTimeout(init, 3000);
          return;
        }

        sb.from("requests")
          .select("id, client_name, client_phone, city, pickup_lat, pickup_lng, destination_address, distance_km, estimated_fare_chf")
          .eq("driver_id", driverId)
          .eq("status", "matched")
          .maybeSingle()
          .then(function(rideRes){
            if (rideRes.data) {
              document.getElementById("pageSub").textContent = "";
              renderActiveRide(rideRes.data);
            } else {
              document.getElementById("pageSub").textContent = tr("subtitle", { city: res.data.city });
              renderDashboard(res.data.city);
            }
          });
      });
  }

  loadTranslations().then(init);
})();
</script>

</body>
</html>
