<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="354" height="260" viewBox="0 0 354 260">
  <!-- The Rotabo mark as the header draws it: the same diamond path and the
       same stops as the symbol block at the top of index.html, the violet one
       first and the gold one laid over its right tip. The offset is the
       header's own geometry: two 26px-wide marks pulled 6px together is 20px
       apart, 153.85 units in this 200-unit box.

       For other sites to link to. The app icons carry the pair inside a padded
       square, which at pill size shrinks each diamond to a few blurred pixels;
       this file is only the mark, so it scales to any height and stays sharp. -->
  <defs>
    <radialGradient id="diamondGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#c264e0"/>
      <stop offset="45%" stop-color="#a239c9"/>
      <stop offset="100%" stop-color="#7c2596"/>
    </radialGradient>
    <path id="diamondShape" d="M118.15,28.88 Q100,5 81.85,28.88 L23.15,106.12 Q5,130 23.15,153.88 L81.85,231.12 Q100,255 118.15,231.12 L176.85,153.88 Q195,130 176.85,106.12 Z"/>
  </defs>
  <use xlink:href="#diamondShape" href="#diamondShape" fill="url(#diamondGrad)"/>
  <use xlink:href="#diamondShape" href="#diamondShape" fill="#ffd41a" transform="translate(153.85 0)"/>
</svg>
